<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUIMS Staff Login</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <img src="logo.png" alt="CUIMS Logo" class="logo">
      <h2>Staff Login</h2>
      <p>Access your staff account using Employee Code and Password</p>

      // Staff login form 
      <input type="text" id="employeeCode" placeholder="Enter Employee Code">
      <input type="password" id="staffPassword" placeholder="Enter Password">
      <button id="staffLoginBtn" class="btn-red">LOGIN</button>

      <div class="separator">OR</div>
      <button class="btn-blue">Forgot Password?</button>

      <div class="store-section">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Download_on_the_App_Store_Badge.svg" alt="App Store">
      </div>
    </div>
    <div class="right-bg"></div>
  </div>

  <script>
    // Example JS logic for staff login
    document.getElementById('staffLoginBtn').addEventListener('click', function() {
      const code = document.getElementById('employeeCode').value;
      const password = document.getElementById('staffPassword').value;

      if(code === '' || password === '') {
        alert('Please enter Employee Code and Password');
      } else {
        // Replace this with real authentication logic
        alert(`Logging in with Employee Code: ${code}`);
        window.location.href = 'staff-dashboard.html'; // redirect after login
      }
    });
  </script>
</body>
</html>
